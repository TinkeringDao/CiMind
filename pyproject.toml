[project]
name = "cimind"
version = "0.3.0"
description = "Local-first, agent-agnostic, auditable cognitive prosthetic and smart-home care kernel for dementia and Alzheimer's care"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "TinkeringDao", email = "203040288+TinkeringDao@users.noreply.github.com" },
]
dependencies = []

[project.scripts]
cimind = "cimind.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
